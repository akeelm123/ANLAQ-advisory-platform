name: Publish TCI programme dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: tci-dashboard-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Stage only approved dashboard files
        run: |
          mkdir -p _site/data
          cp docs/tci/dashboard.html _site/index.html
          cp docs/tci/data/programme-tracker.json _site/data/programme-tracker.json
          python -m json.tool _site/data/programme-tracker.json > /dev/null
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
